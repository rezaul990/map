<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ওয়ালটন প্লাজা কালেকশন ম্যাপ</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
        <h1>ওয়ালটন প্লাজা কালেকশন ম্যাপ</h1>
      </div>
      <p class="subtitle">জেলাভিত্তিক প্লাজা কালেকশন পারফরম্যান্স</p>
    </div>
    <div class="header-right">
      <div class="upload-box">
        <label for="dataFile" class="btn upload-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          ডেটা ফাইল আপলোড
        </label>
        <input type="file" id="dataFile" accept=".xls,.xlsx" hidden>
        <span id="uploadStatus" class="upload-status">কোনো ফাইল আপলোড হয়নি</span>
      </div>
    </div>
  </header>

  <nav class="metric-tabs" id="metricTabs">
    <button class="metric-tab active" data-metric="collectedQty">Collected Acc Qty</button>
    <button class="metric-tab" data-metric="collectableAmt">Collectable Amt.</button>
    <button class="metric-tab" data-metric="overdueChange">Overdue Increase/(Decrease)</button>
  </nav>

  <main class="main">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3>জেলা ফিল্টার</h3>
        <select id="districtFilter" class="filter-select">
          <option value="all">সব জেলা</option>
        </select>
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" placeholder="জেলা খুঁজুন..." aria-label="জেলা খুঁজুন">
        </div>
      </div>

      <div class="legend-section">
        <h3>লিজেন্ড</h3>
        <div class="legend">
          <div class="legend-item"><span class="legend-swatch" style="background:#dc2626"></span> 0 – 69.99%</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#facc15"></span> 70 – 79.99%</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#86efac"></span> 80 – 89.99%</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#16a34a"></span> 90 – 100%</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#64748b"></span> কোনো ডেটা নেই</div>
        </div>
      </div>

      <div class="list-container" id="locationList"></div>
    </aside>

    <div class="map-container">
      <div id="map" class="map">
        <div class="map-empty" id="mapEmpty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <p>ডেটা ফাইল আপলোড করলে এখানে ম্যাপ দেখা যাবে</p>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="js/plaza.js"></script>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
