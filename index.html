<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলাদেশ ভ্রমণ ম্যাপ — Travel Map</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
        <h1>বাংলাদেশ ভ্রমণ ম্যাপ</h1>
      </div>
      <p class="subtitle">বাংলাদেশজুড়ে আপনার ভ্রমণের গল্প দেখান</p>
    </div>
    <div class="header-right">
      <div class="progress-badge">
        <span id="progressCount">0</span>
        <span class="progress-sep">/</span>
        <span id="totalCount">64</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3 id="sidebarTitle">যেসব জেলায় গিয়েছি</h3>
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" placeholder="খুঁজুন..." aria-label="জেলা খুঁজুন">
        </div>
        <div class="action-buttons">
          <button id="selectAllBtn" class="btn btn-sm">সব বাছাই</button>
          <button id="clearAllBtn" class="btn btn-sm btn-ghost">সব মুছুন</button>
        </div>
      </div>

      <div class="list-container" id="locationList"></div>
    </aside>

    <div class="map-container">
      <div id="map" class="map"></div>
      <div class="map-overlay">
        <div class="theme-picker">
          <span class="theme-label">থিম</span>
          <div class="themes" id="themePicker"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="custom-options">
      <div class="custom-name">
        <label for="customName">আপনার নাম</label>
        <input type="text" id="customName" placeholder="নাম লিখুন...">
      </div>
      <div class="custom-image">
        <label for="customImage">ছবি যোগ করুন</label>
        <div class="image-preview" id="imagePreview">
          <input type="file" id="customImage" accept="image/*" hidden>
          <div class="image-placeholder" id="imagePlaceholder">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <div class="export-buttons">
      <button class="btn export-btn" id="exportPng">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        PNG
      </button>
      <button class="btn export-btn" id="exportJpg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        JPG
      </button>
      <button class="btn export-btn" id="exportPdf">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        PDF
      </button>
      <button class="btn export-btn" id="copyData" title="Copy travel data" aria-label="Copy travel data">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
